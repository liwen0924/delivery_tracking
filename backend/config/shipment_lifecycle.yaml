# ---------------------------------------------------------------------------
# Shipment lifecycle definition.
#
# This file is the SINGLE SOURCE OF TRUTH for the shipment state graph.
# It drives, without any code change:
#   * runtime transition validation      (app/domain/state_machine.py)
#   * the `shipment_status` / `shipment_status_transition` lookup tables,
#     which are re-synced on every boot (app/db/lifecycle_sync.py)
#   * the `GET /api/v1/lifecycle` endpoint the React UI renders itself from
#
# Adjusting the state graph = editing this file and restarting. Guards are
# referenced by name and resolved against the registry in
# app/domain/guards.py, so declarative rules stay declarative.
# ---------------------------------------------------------------------------

name: shipment
version: 1

states:
  - code: created
    label: Created
    description: Shipment booked, not yet collected from the sender.
    initial: true
    tone: neutral

  - code: picked_up
    label: Picked up
    description: Collected by the driver, not yet scanned into the network.
    tone: info

  - code: in_transit
    label: In transit
    description: Moving through the network towards the delivery address.
    tone: progress

  - code: delivered
    label: Delivered
    description: Handed over to the recipient. Terminal, happy path.
    terminal: true
    tone: success

  - code: failed
    label: Failed
    description: Delivery could not be completed. Terminal, unhappy path.
    terminal: true
    tone: danger

transitions:
  - event: pick_up
    label: Mark picked up
    from: created
    to: picked_up

  - event: depart
    label: Mark in transit
    from: picked_up
    to: in_transit

  - event: deliver
    label: Mark delivered
    from: in_transit
    to: delivered

  # "failed is allowed from any non-delivered status". Expressed as a wildcard
  # so the rule survives new states being added above it; `except` keeps the
  # exclusions explicit rather than hidden in code.
  - event: fail
    label: Mark failed
    from: "*"
    except: [delivered, failed]
    to: failed
    guards: [require_reason]
    description: Requires a reason so the failure is auditable.
