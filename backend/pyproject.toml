[project]
name = "delivery-tracker-api"
version = "1.0.0"
description = "Delivery status tracking API — FastAPI, PostgreSQL, config-driven state machine."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The engine is created once for the session, so fixtures and tests have to
# share one event loop — asyncpg connections are bound to the loop that made
# them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database (TEST_DATABASE_URL).",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI dependencies are function calls in defaults by design.

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
